# SonarCloud Configuration for GoStarMap
sonar.organization=ctclostio
sonar.projectKey=ctclostio_GoStarMap

# Project Information
sonar.projectName=GoStarMap
sonar.projectVersion=1.0

# Source Code
sonar.sources=.
sonar.exclusions=**/vendor/**,**/hyg/**,**/raylib-5.5_win64_msvc16/**,**/*.md,**/*.txt,**/*.csv,**/*.gz,**/*.tar.gz,**/*.zip,**/*.png,**/*.jpg

# Go specific settings
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.out

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git
